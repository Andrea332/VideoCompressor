# Builds, tests and packages the app on Windows and Linux (x64 and ARM64) and macOS (Apple Silicon).
# For a version tag (v1.2.3) the packages are also uploaded to that release, as a draft if it doesn't exist yet.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.11.3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Windows (ARM64)
            os: windows-11-arm
          - name: Linux
            os: ubuntu-22.04
          # Qt's ARM64 build for Linux is made on Ubuntu 24.04: the AppImage needs its glibc (2.39) or later
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
          - name: macOS (Apple Silicon)
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the first with a Windows ARM64 build here
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install tools (Windows)
        if: runner.os == 'Windows' && runner.arch == 'X64'   # the ARM64 image already has them
        run: choco install innosetup ninja -y --no-progress

      - name: Visual Studio environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 file

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        shell: bash
        run: |
          pip install py7zr
          qt_dir=$(python ci/install_qt.py "$QT_VERSION" "$RUNNER_TEMP/Qt")
          echo "QT_DIR=$qt_dir" >> "$GITHUB_ENV"
          echo "$qt_dir/bin" >> "$GITHUB_PATH"

      - name: Download FFmpeg
        run: python ci/get_ffmpeg.py ffmpeg

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$QT_DIR" "${extra[@]}"

      - name: Build
        run: cmake --build build

      # verbose: the log shows which encoders this machine has and how accurate the estimates were
      - name: Test
        run: ctest --test-dir build --output-on-failure --verbose

      # The picture at the top of the README: it is attached to every release with the same name, and the
      # README shows the one of the latest release
      - name: Screenshot for the README (Windows)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\Videos | Out-Null
          $video = "C:\Videos\Holiday trip.mp4"
          build\ffmpeg\ffmpeg.exe -v error -y -f lavfi `
            -i "gradients=s=1920x1080:r=30:d=60:c0=0x2563eb:c1=0xe8890c:c2=0x7c3aed:nb_colors=3:speed=0.02" `
            -f lavfi -i "sine=f=330:d=60" -c:v libx264 -crf 16 -pix_fmt yuv420p -c:a aac -shortest $video
          $env:QT_QPA_PLATFORM = "windows"   # the real look of the app, not the plain offscreen rendering
          $env:QT_SCALE_FACTOR = "1.5"       # sharp on high-density screens
          $env:VC_SCREENSHOT_VIDEO = $video
          $env:VC_SCREENSHOT_DIR = "$PWD\build"
          build\tst_video_compressor.exe rendersWindow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item build\window.png build\VideoCompressor-screenshot.png -Force

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -B build

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: QMAKE="$QT_DIR/bin/qmake" packaging/linux/package.sh build

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/package.sh build

      # The packaged app must start on its own, with the platform plugin it ships (no missing library or
      # plugin), and run its bundled FFmpeg
      - name: Smoke test of the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the portable zip's copy: its VideoCompressor.ini keeps the settings in the folder
          $app = Get-ChildItem build/_CPack_Packages/*/ZIP -Recurse -Filter VideoCompressor.exe | Select-Object -First 1
          if (-not (Test-Path "$($app.DirectoryName)/VideoCompressor.ini")) { throw "no VideoCompressor.ini in the zip" }
          & "$($app.DirectoryName)/ffmpeg/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if ($p.HasExited) { throw "the app exited with code $($p.ExitCode)" }
          # a Qt error dialog would keep the process alive too: the main window must be there
          if ($p.MainWindowTitle -notlike "Video Compressor*") { throw "unexpected window: '$($p.MainWindowTitle)'" }
          Stop-Process -Id $p.Id
          Get-Content "$($app.DirectoryName)/VideoCompressor.ini"   # with the update check's date, if it got online

      - name: Smoke test of the package (Linux)
        if: runner.os == 'Linux'
        working-directory: build
        run: |
          sudo apt-get install -y xvfb
          ./VideoCompressor-*.AppImage --appimage-extract > /dev/null
          squashfs-root/usr/bin/ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
          status=0
          xvfb-run -a timeout 10 squashfs-root/AppRun || status=$?
          [ "$status" -eq 124 ] || { echo "the app exited with code $status"; exit 1; }
          # the portable folder, run from where it is extracted
          mkdir portable && tar -C portable -xzf VideoCompressor-*-portable.tar.gz
          launcher=$(ls -d portable/*/VideoCompressor)
          [ -f "$(dirname "$launcher")/VideoCompressor.ini" ] || { echo "no VideoCompressor.ini"; exit 1; }
          status=0
          xvfb-run -a timeout 10 "$launcher" || status=$?
          [ "$status" -eq 124 ] || { echo "the portable app exited with code $status"; exit 1; }

      - name: Smoke test of the package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=build/dmg/VideoCompressor.app/Contents/MacOS
          "$app/ffmpeg/ffmpeg" -hide_banner -version | head -n 1
          "$app/VideoCompressor" &
          pid=$!
          sleep 10
          kill -0 "$pid" || { echo "the app exited"; exit 1; }
          kill "$pid"
          # the portable zip has the whole app, still signed
          ditto -x -k build/VideoCompressor-*-portable.zip portable
          codesign --verify --deep --strict portable/VideoCompressor.app

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCompressor-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            build/VideoCompressor-screenshot.png
            build/VideoCompressor-*-win*.exe
            build/VideoCompressor-*-win*.zip
            build/VideoCompressor-*.AppImage
            build/VideoCompressor-*.dmg
            build/VideoCompressor-*-portable.*

  # Tests built with AddressSanitizer and UndefinedBehaviorSanitizer: any invalid memory access, in the app
  # or in Qt while it uses the app's objects, stops the tests with the exact place
  sanitizers:
    name: Linux (sanitizers)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1 libdbus-1-3

      - name: Install Qt
        run: |
          pip install py7zr
          qt_dir=$(python ci/install_qt.py "$QT_VERSION" "$RUNNER_TEMP/Qt")   # stops here if it fails
          echo "QT_DIR=$qt_dir" >> "$GITHUB_ENV"

      - name: Download FFmpeg
        run: python ci/get_ffmpeg.py ffmpeg

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_PREFIX_PATH=$QT_DIR" \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Video Compressor ${GITHUB_REF_NAME#v}" --notes "Release notes coming soon."
          gh release upload "$GITHUB_REF_NAME" packages/* --clobber
